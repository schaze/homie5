[package]
name = "homie5"
version = "0.12.1"
edition = "2021"
rust-version = "1.82"
publish = true
description = "Low level implemenation of the homie v5 protocol"
repository = "https://github.com/schaze/homie5"
license = "MIT"
authors = ["schaze <schazet@gmail.com>"]
readme = "README.md"
keywords = ["homie", "iot", "mqtt"]

[features]
default = ["std"]
# Without `std` the crate is `no_std` and only needs `alloc`.
std = ["serde/std", "serde_json/std", "chrono/std", "thiserror/std"]
ext-meta = ["std"]
schemars = ["std", "dep:schemars"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
thiserror = { version = "2.0", default-features = false }
libm = "0.2"
schemars = { version = "1.2", optional = true }

[dev-dependencies]
chrono = { version = "0.4", features = ["clock"] }
rumqttc = "0.25"
bytes = "1"
tokio = { version = "1.52", features = ["full"] }
anyhow = "1"
ctrlc = "3.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml_ng = "0.10"
